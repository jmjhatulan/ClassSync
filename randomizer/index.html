<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Classroom randomizers for wheels, dice, races, groups, and more."
    />
    <title>ClassSync Randomizer</title>
    <link rel="icon" type="image/png" href="../assets/ClassSync.png" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <a class="app-brand" href="../" aria-label="Back to ClassSync">
        <img src="../assets/ClassSync.png" alt="" />
        <span class="sr-only">ClassSync home</span>
      </a>
      <h1>Classroom Randomizer</h1>
      <span class="header-mark">Pick a little surprise</span>
    </header>

    <main class="page-shell">
      <p class="page-intro">
        Choose a randomizer, set it up your way, and let chance decide.
      </p>
      <nav class="mode-nav" aria-label="Randomizer type">
        <button type="button" class="mode-button is-active" data-mode="wheel" aria-pressed="true">🎡 Wheel</button>
        <button type="button" class="mode-button" data-mode="dice" aria-pressed="false">🎲 Dice</button>
        <button type="button" class="mode-button" data-mode="gun" aria-pressed="false">🔘 Wheel Gun</button>
        <button type="button" class="mode-button" data-mode="race" aria-pressed="false">🏁 Race</button>
        <button type="button" class="mode-button" data-mode="number" aria-pressed="false">🔢 Number</button>
        <button type="button" class="mode-button" data-mode="coin" aria-pressed="false">🪙 Coin Flip</button>
        <button type="button" class="mode-button" data-mode="groups" aria-pressed="false">👥 Groups</button>
      </nav>
      <section id="randomizer-panel" class="randomizer-panel" aria-live="polite"></section>
      <footer class="page-footer">Made for curious classrooms</footer>
    </main>
  </body>
</html>
