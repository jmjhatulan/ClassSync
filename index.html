<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ClassSync - a central hub for classroom and teaching tools."
    />
    <title>ClassSync</title>
    <link rel="icon" type="image/png" href="assets/ClassSync.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hub">
      <header class="hub__header">
        <h1>
          <img
            class="hub__logo"
            src="assets/ClassSync.png"
            alt="ClassSync learning logo"
          />
        </h1>
        <p>classic tools for teaching, learning, and everything in between.</p>
      </header>

      <section class="tool-grid" aria-label="ClassSync tools">
        <a
          class="tool-card tool-card--presenter"
          href="PDF%20Presenter/index.html"
        >
          <span class="tool-card__art" aria-hidden="true">
            <span class="paper paper--back"></span>
            <span class="paper paper--front">
              <span class="paper__line"></span>
              <span class="paper__line paper__line--short"></span>
              <span class="paper__fold"></span>
            </span>
            <span class="tool-card__badge">PDF</span>
          </span>
          <span class="tool-card__content">
            <span class="tool-card__title">PDF Presenter</span>
            <span class="tool-card__description">
              Present documents clearly and keep your notes close.
            </span>
          </span>
          <span class="tool-card__arrow" aria-hidden="true">&rarr;</span>
        </a>

        <a
          class="tool-card tool-card--calculator"
          href="Transmuted%20Grade%20Target%20Calculator/index.html"
        >
          <span class="tool-card__art" aria-hidden="true">
            <span class="calculator">
              <span class="calculator__screen">A+</span>
              <span class="calculator__keys">
                <i></i><i></i><i></i><i></i><i></i><i></i>
              </span>
            </span>
            <span class="calculator__spark">★</span>
          </span>
          <span class="tool-card__content">
            <span class="tool-card__title">Grade Target Calculator</span>
            <span class="tool-card__description">
              Work out the scores you need to reach your target grade.
            </span>
          </span>
          <span class="tool-card__arrow" aria-hidden="true">&rarr;</span>
        </a>
      </section>

      <footer class="hub__footer">made for curious classrooms</footer>
    </main>
  </body>
</html>
